# Revisión automática de las directrices en cada pull request y en cada cambio a main.
# Corre las pruebas del portal, las reglas comunes que todo módulo debe cumplir y las pruebas propias de cada
# módulo, contra una base PostgreSQL desechable. Si algo falla, el pull request no se puede integrar
# (activar "Require status checks to pass" en la protección de main, con el chequeo "Pruebas y directrices").
name: Revisión

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y directrices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fricke
          POSTGRES_PASSWORD: fricke_desarrollo
          POSTGRES_DB: fricke_store
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fricke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ECO_PRUEBAS_ADMIN_URL: postgresql://fricke:fricke_desarrollo@127.0.0.1:5432/postgres
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Alcance del cambio (los colaboradores solo tocan sus módulos)
        if: github.event_name == 'pull_request'
        # Se usa la versión del revisor y de la lista que está en main, para que una rama no pueda cambiarlas a su favor.
        run: |
          git show "$BASE:.github/revisar_alcance.py" > "$RUNNER_TEMP/revisar_alcance.py" 2>/dev/null || cp .github/revisar_alcance.py "$RUNNER_TEMP/"
          git show "$BASE:.github/mantenedores.txt" > "$RUNNER_TEMP/mantenedores.txt" 2>/dev/null || cp .github/mantenedores.txt "$RUNNER_TEMP/"
          python "$RUNNER_TEMP/revisar_alcance.py" "$AUTOR" "$BASE" "$CAMBIO"
        env:
          AUTOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CAMBIO: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Vulnerabilidades conocidas en las librerías (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Pruebas del portal, reglas de módulos y pruebas de cada módulo
        run: pytest -rf
